[project]
name = "food-inspection-risk"
version = "1.0.0"
description = "Food safety risk scoring for inspection prioritization (Chicago Food Inspections)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "streamlit>=1.40",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "tabulate>=0.10.0",
]

[tool.uv]
package = false
